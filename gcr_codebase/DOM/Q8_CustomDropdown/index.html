<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Dropdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dropdown" id="dropdown">
    <button id="dropdownButton">Choose a course ▾</button>
    <div id="options" class="options">
      <button data-value="HTML">HTML</button>
      <button data-value="CSS">CSS</button>
      <button data-value="JavaScript">JavaScript</button>
      <button data-value="Java">Java</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
