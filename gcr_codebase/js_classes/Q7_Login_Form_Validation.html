<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login Validation</title>
<style>body{font-family:Arial,sans-serif;max-width:420px;margin:30px auto;padding:16px}input,button{box-sizing:border-box;width:100%;padding:10px;margin:8px 0}#error{color:#c00}#success{color:green}</style></head><body>
<h2>Login</h2><form id="loginForm" novalidate><label>Username</label><input id="username" type="text"><label>Password</label><input id="password" type="password"><button type="submit">Login</button></form><p id="error"></p><p id="success"></p>
<script>
document.getElementById("loginForm").addEventListener("submit",event=>{
 event.preventDefault();const username=document.getElementById("username").value,password=document.getElementById("password").value,errors=[];
 if(!/^.{5,}$/.test(username))errors.push("Username must be at least 5 characters.");
 if(password.length<8)errors.push("Password must be at least 8 characters.");
 if(!/[0-9]/.test(password))errors.push("Password must include a number.");
 if(!/[A-Z]/.test(password))errors.push("Password must include an uppercase letter.");
 if(!/[a-z]/.test(password))errors.push("Password must include a lowercase letter.");
 if(!/[^A-Za-z0-9]/.test(password))errors.push("Password must include a special character.");
 document.getElementById("error").textContent=errors.join(" ");
 document.getElementById("success").textContent=errors.length===0?"Validation successful!":"";
});
</script></body></html>
