<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline Formatting</title>
</head>
<body>

    <!-- Multiple inline elements -->
    <p>
        <strong>Learning</strong> is a <em>continuous</em> process.
        <mark>Practice</mark> makes our skills better.
        <small>Keep learning!</small>
        <br>
        Never stop improving yourself.
    </p>

</body>
</html>
