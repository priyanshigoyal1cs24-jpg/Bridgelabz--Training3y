<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>

    <!-- Page heading -->
    <h1>Select Your Travel Destination</h1>

    <!-- Country selection -->
    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>Australia</option>
    </select>

    <br><br>

    <!-- State selection -->
    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
    </select>

    <br><br>

    <!-- City selection -->
    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Lucknow</option>
        <option>Varanasi</option>
    </select>

    <br><br>

    <!-- Tourist place selection -->
    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Red Fort</option>
        <option>Gateway of India</option>
        <option>India Gate</option>
    </select>

    <!-- Summary -->
    <p>
        My selected country is India, state is Uttar Pradesh,
        city is Mathura, and my favorite tourist place is Taj Mahal.
    </p>

</body>
</html>
