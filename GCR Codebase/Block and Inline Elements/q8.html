<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>

    <!-- School heading -->
    <h1>ABC Public School</h1>

    <h2>Student Report Card</h2>

    <table border="1" title="Student marks report">

        <tr>
            <th rowspan="2">Subject</th>
            <th colspan="2">Marks</th>
        </tr>

        <tr>
            <th>Maximum</th>
            <th>Obtained</th>
        </tr>

        <tr>
            <td>English</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Mathematics</td>
            <td>100</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Science</td>
            <td>100</td>
            <td>88</td>
        </tr>

        <tr>
            <td>Computer</td>
            <td>100</td>
            <td>95</td>
        </tr>

        <tr>
            <td>Social Science</td>
            <td>100</td>
            <td>82</td>
        </tr>

        <tr>
            <td colspan="2"><strong>Total</strong></td>
            <td><strong>440 / 500</strong></td>
        </tr>

        <tr>
            <td colspan="2"><strong>Percentage</strong></td>
            <td><strong>88%</strong></td>
        </tr>

    </table>

</body>
</html>
