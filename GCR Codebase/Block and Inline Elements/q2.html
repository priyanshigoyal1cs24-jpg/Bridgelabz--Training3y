<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>

    <!-- Product catalog heading -->
    <h1>Online Store Product Catalog</h1>

    <table border="1">
        <caption>Available Products</caption>

        <tr>
            <th>Image</th>
            <th>Product Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/100"
                     alt="Laptop image">
            </td>
            <td>Laptop</td>
            <td>Powerful laptop for students.</td>
            <td>₹50,000</td>
            <td rowspan="2">In Stock</td>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/100"
                     alt="Mobile phone image">
            </td>
            <td>Mobile Phone</td>
            <td>Smartphone with modern features.</td>
            <td>₹25,000</td>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/100"
                     alt="Headphones image">
            </td>
            <td>Headphones</td>
            <td>Wireless headphones with clear sound.</td>
            <td>₹2,000</td>
            <td>Available Soon</td>
        </tr>

        <tr>
            <td colspan="4"><strong>Special Offer</strong></td>
            <td>10% Off</td>
        </tr>

    </table>

</body>
</html>
