<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>

<header>
    <h1>CSS Selectors Practice</h1>
</header>

<main>
    <section>
        <p>Element selector example.</p>

        <p class="highlight">Class selector example.</p>

        <p id="special">ID selector example.</p>

        <input type="text" placeholder="Attribute selector">

        <div class="parent">
            <p>Descendant selector</p>
            <section>
                <p>Nested element</p>
            </section>
        </div>

        <ul>
            <li>Item One</li>
            <li>Item Two</li>
        </ul>

        <p class="after">Paragraph after list</p>
        <p class="sibling">General sibling paragraph</p>

        <a href="#">Example Link</a>
    </section>
</main>

<footer>
    <p>CSS Selectors Practice Page</p>
</footer>

</body>
</html>
