<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing</title>
    <link rel="stylesheet" href="style8.css">
</head>
<body>

<header>
    <h1>Box-Sizing Comparison</h1>
</header>

<main class="container">

    <section class="box content-box">
        <h2>content-box</h2>
        <p>
            Default box-sizing. Width applies only to content,
            so padding and border increase the total size.
        </p>
    </section>

    <section class="box border-box">
        <h2>border-box</h2>
        <p>
            Width includes content, padding and border,
            keeping the total size equal to the declared width.
        </p>
    </section>

</main>

</body>
</html>
