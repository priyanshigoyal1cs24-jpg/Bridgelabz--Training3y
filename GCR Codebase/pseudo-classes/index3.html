<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

<header>
    <h1>Image Showcase</h1>
</header>

<main class="gallery">

    <figure>
        <div class="image-box">
            <img src="https://picsum.photos/400/300?1" alt="Nature">
            <div class="overlay"></div>
        </div>
        <figcaption>Nature</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://picsum.photos/400/300?2" alt="Mountain">
            <div class="overlay"></div>
        </div>
        <figcaption>Mountain</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://picsum.photos/400/300?3" alt="City">
            <div class="overlay"></div>
        </div>
        <figcaption>City</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://picsum.photos/400/300?4" alt="Travel">
            <div class="overlay"></div>
        </div>
        <figcaption>Travel</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://picsum.photos/400/300?5" alt="Beach">
            <div class="overlay"></div>
        </div>
        <figcaption>Beach</figcaption>
    </figure>

    <figure>
        <div class="image-box">
            <img src="https://picsum.photos/400/300?6" alt="Forest">
            <div class="overlay"></div>
        </div>
        <figcaption>Forest</figcaption>
    </figure>

</main>

</body>
</html>
