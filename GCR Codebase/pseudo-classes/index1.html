<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<header>
    <h1>Pseudo-Classes Demonstration</h1>
</header>

<main class="container">

    <section class="example">
        <a href="#">Hover Link</a>
        <p><strong>:hover</strong> changes the link when mouse is over it.</p>
    </section>

    <section class="example">
        <button>Focus Button</button>
        <p><strong>:focus</strong> applies a style when the button is focused.</p>
    </section>

    <section class="example">
        <button class="active-btn">Active Button</button>
        <p><strong>:active</strong> applies a style while clicking.</p>
    </section>

    <section class="example">
        <ul>
            <li>First Item</li>
            <li>Second Item</li>
            <li>Third Item</li>
        </ul>
        <p><strong>:nth-child()</strong> selects a specific list item.</p>
    </section>

</main>

<footer>
    <p>Pseudo-Classes Practice</p>
</footer>

</body>
</html>
