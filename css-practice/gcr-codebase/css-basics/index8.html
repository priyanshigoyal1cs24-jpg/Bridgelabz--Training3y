<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="style8.css">
</head>

<body>

    <!-- Fixed Header -->
    <header class="header">
        <h1>My Dashboard</h1>

        <div class="profile">
            Welcome, Priyanshi
        </div>
    </header>


    <!-- Dashboard Layout -->
    <div class="dashboard">

        <!-- Left Sidebar -->
        <aside class="sidebar">

            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Projects</a>
                <a href="#">Messages</a>
                <a href="#">Settings</a>
                <a href="#">Logout</a>
            </nav>

        </aside>


        <!-- Right Main Content -->
        <main class="main-content">

            <h2>Dashboard Overview</h2>

            <section class="boxes">

                <!-- Box 1 -->
                <article class="box">
                    <h3>Total Projects</h3>
                    <p class="number">24</p>
                    <p>Projects completed and active</p>
                </article>

                <!-- Box 2 -->
                <article class="box">
                    <h3>Tasks Completed</h3>
                    <p class="number">156</p>
                    <p>Tasks completed this month</p>
                </article>

                <!-- Box 3 -->
                <article class="box">
                    <h3>Messages</h3>
                    <p class="number">18</p>
                    <p>New messages received</p>
                </article>

                <!-- Box 4 -->
                <article class="box">
                    <h3>Progress</h3>
                    <p class="number">82%</p>
                    <p>Overall project progress</p>
                </article>

            </section>

        </main>

    </div>

</body>
</html>
