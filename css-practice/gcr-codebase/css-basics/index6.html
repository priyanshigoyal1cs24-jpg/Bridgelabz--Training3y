<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <link rel="stylesheet" href="style6.css">
</head>

<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore beautiful places around the world</p>
    </header>

    <main class="gallery">

        <!-- Image 1 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=1"
                 alt="Mountain Landscape">

            <div class="caption">
                <h2>Mountain</h2>
                <p>Beautiful mountain view</p>
            </div>
        </div>

        <!-- Image 2 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=2"
                 alt="Nature">

            <div class="caption">
                <h2>Nature</h2>
                <p>Peaceful natural scenery</p>
            </div>
        </div>

        <!-- Image 3 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=3"
                 alt="Forest">

            <div class="caption">
                <h2>Forest</h2>
                <p>Green and refreshing forest</p>
            </div>
        </div>

        <!-- Image 4 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=4"
                 alt="Beach">

            <div class="caption">
                <h2>Beach</h2>
                <p>Relaxing beach destination</p>
            </div>
        </div>

        <!-- Image 5 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=5"
                 alt="City">

            <div class="caption">
                <h2>City</h2>
                <p>Beautiful city landscape</p>
            </div>
        </div>

        <!-- Image 6 -->
        <div class="gallery-item">
            <img src="https://picsum.photos/500/400?random=6"
                 alt="Lake">

            <div class="caption">
                <h2>Lake</h2>
                <p>Calm and peaceful lake</p>
            </div>
        </div>

    </main>

</body>
</html>
